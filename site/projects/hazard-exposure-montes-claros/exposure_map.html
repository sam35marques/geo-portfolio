    function(layer){
    let div = L.DomUtil.create('div');
    
    let handleObject = feature => {
        if (feature === null) {
            return '';
        } else if (typeof(feature)=='object') {
            return JSON.stringify(feature);
        } else {
            return feature;
        }
    }
    let fields = ["h3", "pop_exposed_any", "share_exposed_pct", "pop_exposed_flood", "pop_exposed_slope", "pop_census", "pop_kontur", "buildings"];
    let aliases = ["H3 cell", "Exposed residents (any hazard)", "Share of residents exposed (%)", "\u2026in flood-prone lowlands (HAND \u2264 3 m)", "\u2026on slopes \u2265 30%", "Residents (Census 2022, dasymetric)", "Kontur Population 2023", "Buildings (confidence \u2265 0.75)"];
    let table = '<table>' +
        String(
        fields.map(
        (v,i)=>
        `<tr>
            <th>${aliases[i].toLocaleString()}</th>
            
            <td>${handleObject(layer.feature.properties[v]).toLocaleString()}</td>
        </tr>`).join(''))
    +'</table>';
    div.innerHTML=table;
    
    return div
    }
