# Configuração da cidade: Montes Claros (MG).
# Para rodar o fluxo em outro município, copie este arquivo e troque os valores.
# Caminhos são relativos à raiz do repositório.

city:
  name: "Montes Claros"
  state: "MG"
  ibge_code: 3143302          # código IBGE do município (7 dígitos)

crs:
  metric: "EPSG:31983"        # SIRGAS 2000 / UTM 23S — áreas, distâncias, declividade
  geographic: "EPSG:4326"     # WGS 84 — só para H3 e mapas web

aoi:
  # P01: AOI = perímetro urbano = união das Regiões de Planejamento (DECISIONS 2026-11-24).
  # Outras opções: "ibge_municipality" (limite municipal, usado na Fase 0).
  source: "planning_regions"
  region_name_field: "Nome_Polo"   # campo com o nome da região
  gap_closing_m: 5            # fecha frestas entre regiões vizinhas na união (DECISIONS)
  buffer_m: 0                 # buffer em metros aplicado à AOI (documentar ao mudar)

h3:
  resolution: 8               # mesma resolução da Kontur Population
  resolution_detail: 9

paths:
  raw: "data/raw"
  interim: "data/interim"
  processed: "data/processed"
  dem: "data/raw/dem/alos_palsar/moc_dem.tif"
  municipality: "data/raw/boundaries/ibge/municipio_3143302.geojson"
  planning_regions: "data/raw/boundaries/regioes_planejamento/Regioes_Planejamento_atualizados2.shp"
  census_tracts: "data/raw/population/ibge_census_2022/MG_setores_CD2022.gpkg"
  sgb_risk_zip: "data/raw/hazard/sgb_cprm/sig_montesclaros_mg_risco_2012.zip"
  kontur: "data/raw/population/kontur/kontur_population_BR_20231101.gpkg.gz"
  glo30_dir: "data/raw/dem/copernicus_glo30"
  open_buildings: "data/raw/buildings/open_buildings/open_buildings_v3_montes_claros.csv"
  atlas_streams: "data/raw/hydrography/atlas_hidrografico/hidrografia/CORREGOS_URB_MOC.shp"
  atlas_basins: "data/raw/hydrography/atlas_hidrografico/bacias_urbanas/BACIAS_URBANAS_MOC_ZONA_EXP.shp"
  interim_p01: "data/interim/p01"
  processed_p01: "data/processed/p01"
  sgb_inundation_2014: "data/raw/hazard/sgb_cprm/suscetibilidade_2014/Inundacao_A.shp"
  sgb_mass_movement_2014: "data/raw/hazard/sgb_cprm/suscetibilidade_2014/Movimento_de_Massa_A.shp"

terrain:
  dem_main: "glo30"            # MDE principal (DECISIONS 2026-11-24)
  resolution_m: 30             # grade de trabalho em EPSG:31983
  # domínio hidrológico = AOI + buffer: inclui as áreas a montante dos córregos
  # urbanos, para não cortar a drenagem na borda da cidade
  domain_buffer_m: 25000
  # limiares de área de contribuição (km²) testados contra a hidrografia do Atlas
  stream_threshold_candidates_km2: [0.1, 0.25, 0.5, 1.0, 2.0, 3.0, 5.0]
  # distância de tolerância (m) para considerar que dois traçados coincidem
  stream_match_tolerance_m: 60

sources:
  # API de malhas do IBGE (limite municipal; GeoJSON em EPSG:4674 / SIRGAS 2000)
  municipality_url: "https://servicodados.ibge.gov.br/api/v3/malhas/municipios/3143302?formato=application/vnd.geo+json&qualidade=maxima"

  # Arquivos baixados por projects/01-.../scripts/01_download_data.py
  # (url -> caminho em data/raw). Tamanhos conferidos em 2026-11-24.
  downloads:
    census_tracts:   # malha de setores 2022 de MG COM atributos do Censo (177 MB)
      url: "https://ftp.ibge.gov.br/Censos/Censo_Demografico_2022/Agregados_por_Setores_Censitarios/malha_com_atributos/setores/gpkg/UF/MG/MG_setores_CD2022.gpkg"
      dest: "data/raw/population/ibge_census_2022/MG_setores_CD2022.gpkg"
    census_dictionary:
      url: "https://ftp.ibge.gov.br/Censos/Censo_Demografico_2022/Agregados_por_Setores_Censitarios/dicionario_de_dados_agregados_por_setores_censitarios_20261113.xlsx"
      dest: "data/raw/population/ibge_census_2022/dicionario_de_dados_agregados_por_setores_censitarios_20261113.xlsx"
    kontur_population:   # Kontur Population Brasil, H3 r8, versão 2023-11-01 (149 MB, gzip)
      url: "https://geodata-eu-central-1-kontur-public.s3.amazonaws.com/kontur_datasets/kontur_population_BR_20231101.gpkg.gz"
      dest: "data/raw/population/kontur/kontur_population_BR_20231101.gpkg.gz"
    sgb_risk_vectors:    # SGB/CPRM 2012, setores de risco alto e muito alto (vetores)
      url: "https://rigeo.sgb.gov.br/bitstreams/a2907247-1041-444b-bf5f-7314e6d62b0d/download"
      dest: "data/raw/hazard/sgb_cprm/sig_montesclaros_mg_risco_2012.zip"
    sgb_susceptibility_2014:   # Carta de suscetibilidade SGB 2014, vetores SIG (294 MB)
      url: "https://rigeo.sgb.gov.br/bitstreams/e8835d88-341b-4be4-a864-e5644c0388e1/download"
      dest: "data/raw/hazard/sgb_cprm/sig_montesclaros_mg_suscetibilidade_2014.zip"
    sgb_susceptibility_2014_map:   # mapa da carta em PDF (44 MB): legenda e nota metodológica
      url: "https://rigeo.sgb.gov.br/bitstreams/508f38c0-87ee-4bed-a133-bf331c81fc55/download"
      dest: "data/raw/hazard/sgb_cprm/CS-MontesClaros.pdf"
    sgb_risk_report:     # relatório e pranchas (6,7 MB)
      url: "https://rigeo.sgb.gov.br/bitstreams/bd87a5dd-e2ec-44f9-ba05-bbbfec450cec/download"
      dest: "data/raw/hazard/sgb_cprm/produtos_montesclaros_mg_risco.zip"

  # Copernicus DEM GLO-30 (AWS Open Data), tiles de 1°x1° em COG
  glo30_base_url: "https://copernicus-dem-30m.s3.amazonaws.com"
  glo30_tiles: ["S17_00_W044", "S18_00_W044", "S17_00_W045", "S18_00_W045"]
  glo30_dir: "data/raw/dem/copernicus_glo30"

dem:
  nodata: 32767               # valor NoData do arquivo original (UInt16)
  nominal_resolution_m: 12.5
  effective_resolution_m: 30  # RTC 12,5 m é reamostrado de MDE ~30 m (a confirmar e documentar)

# --- Limiares (todo limiar arbitrário é parâmetro e entra na sensibilidade) ---
thresholds:
  slope_pct_legal: 30                    # Lei 6.766/79
  slope_classes_embrapa_pct: [0, 3, 8, 20, 45, 75]   # limites inferiores das classes EMBRAPA
  hand_m: [1, 2, 3, 5]                   # HAND ≤ h (m); principal definido no Projeto 1
  hand_m_main: 3                         # fixado a priori, antes da validação (DECISIONS 2026-11-24)
  stream_threshold_km2_main: 2.0         # área de contribuição mínima da drenagem (DECISIONS 2026-11-24)
  stream_threshold_km2: [1.0, 2.0, 3.0]  # sensibilidade do HAND à rede de drenagem
  open_buildings_confidence: [0.65, 0.70, 0.75]
  open_buildings_confidence_main: 0.75

# Extensão do export do Open Buildings no GEE (mesmo retângulo de 02_open_buildings_gee.js).
# Setores que saem deste retângulo têm a população reduzida à fração de área coberta.
open_buildings_export_bbox_4326: [-43.9245, -16.8032, -43.7830, -16.6305]
